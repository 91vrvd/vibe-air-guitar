<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Vibe · 本地验收</title>
<style>body{font:15px system-ui;background:#122019;color:#e4f0d5;padding:20px}iframe{width:100%;height:680px;border:1px solid #54674e}button{padding:12px}pre{white-space:pre-wrap}</style>
<h1>浏览器音频与交互验收</h1><p>只在本地运行。点击后测试当前音频引擎、和弦循环与真实录音解码，不开启摄像头。</p><button id="run">运行验收</button><button id="models">测试手势模型（不访问摄像头）</button><pre id="result">等待开始</pre><pre id="modelResult"></pre>
<iframe id="app" src="../index.html" allow="autoplay"></iframe>
<script>
document.querySelector('#app').onload = () => {
 const app=document.querySelector('#app').contentDocument;
 const script=app.createElement('script');script.src='./_tests/engine-smoke.js?v=34';app.body.append(script);
};
document.querySelector('#run').onclick = async () => {
 const result=document.querySelector('#result');result.textContent='运行中…';
 try { result.textContent=await document.querySelector('#app').contentWindow.runEngineSmoke(); }
 catch(e) {result.textContent='FAIL: '+e.stack;}
};
document.querySelector('#models').onclick = async () => {
 const result=document.querySelector('#modelResult');result.textContent='加载模型中…';
 try { result.textContent=await document.querySelector('#app').contentWindow.runModelSmoke(); }
 catch(e) {result.textContent='FAIL: '+e.stack;}
};
</script></html>
